# ==============================================================================
# 1. أداء الهاردوير والمزامنة (الأعلى أهمية - يحل مشكلة الـ Lag والدروب في 1080p)
# ==============================================================================
#hwdec=mediacodec                 # تفعيل فك التشفير العتادي القياسي للأندرويد
#vo=mediacodec_embed              # العرض المباشر على الشاشة لتفادي إجهاد كارت الشاشة
#video-sync=audio                 # حل مشكلة التقطيع المتكرر كل 3 ثوانٍ بمزامنة الصوت
#vd-lavc-dr=yes                   # تفعيل الرندرة المباشرة لتسريع نقل البيانات
#framedrop=vo                     # إسقاط الإطارات بذكاء عند وجود ضغط
#deinterlace=no                   # إيقاف معالجة التفكيك الثقيلة لتوفير 40% من المعالج

# ==============================================================================
# 2. إعدادات الشبكة والبث المباشر (IPTV & Network)
# ==============================================================================
cache=yes                        # تفعيل التخزين المؤقت للبث
#cache-secs=120                   # تخصيص ثواني التخزين المؤقت
cache-pause=yes                  # إيقاف مؤقت للبث عند فرغ الكاش بدلاً من التقطيع
demuxer-max-bytes=150M           # حجم ذاكرة البفر المخصصة للبث
demuxer-max-back-bytes=50M       # ذاكرة الترجيع للخلف أثناء المشاهدة
demuxer-readahead-secs=30        # القراءة المسبقة للبث بـ 30 ثانية
seekable=yes                     # تفعيل شريط التقديم والتأخير
force-seekable=yes               # إجبار إمكانية التقديم في البث المباشر
network-timeout=10               # إعطاء مهلة 10 ثوانٍ للشبكة قبل إظهار خطأ
stream-lavf-o=reconnect=1,reconnect_at_eof=1,reconnect_streamed=1,reconnect_delay_max=2 # إعادة الاتصال تلقائياً عند انقطاع السيرفر

# ==============================================================================
# 3. معالجة الفيديو والأبعاد (خفيفة وسلسة لمعالج Mali-G31)
# ==============================================================================
scale=bilinear                   # خيار معالجة الأبعاد الأخف والأسرع لتفادي Lag 1080p
cscale=bilinear                  # خيار معالجة ألوان الكروما الأخف والأسرع
dscale=mitchell                  # طريقة تصغير حجم الصورة عند الحاجة

# ==============================================================================
# 4. تحسين جودة الصورة والوضوح (Image Quality)
# ==============================================================================
sharpen=0.5                      # إعطاء حدة ووضوح لتفاصيل قنوات 1080p
video-output-levels=full         # إظهار الألوان بنطاق كامل (أسود حقيقي)
deband=yes                       # تفعيل فلتر إزالة التدرجات والتجهيم في الصورة
deband-iterations=1              # عدد دورات الفلترة (خفيفة وسريعة)
deband-threshold=35              # حد عتبة الفلترة
deband-range=16                  # نطاق معالجة التدرج
deband-grain=0                   # عدم إضافة تشويش اصطناعي
dither-depth=auto                # ضبط عمق الألوان تلقائياً
dither=fruit                     # خوارزمية دمج الألوان الخفيفة

# ==============================================================================
# 5. الأوامر المستبعدة / المعطلة (تم إيقافها لمنع التضارب أو التقطيع)
# ==============================================================================
#cache=no                        # معطل: يمنع التخزين المؤقت ويسبب تقطيعاً مستمراً
#hwdec=auto                      # معطل: تم استبداله بـ hwdec=mediacodec المباشر
#hwdec=mediacodec-copy           # معطل: يستهلك ذاكرة إضافية بدون فائدة
#hwdec=no                        # معطل: يلغي فك التشفير العتادي ويسبب Lag كبير
#vo=gpu                          # معطل: يجهد كارت الشاشة ويسبب Lag في قنوات 1080p
#gpu-context=android             # معطل: غير مطلوب عند استخدام vo=mediacodec_embed
#demuxer-lavf-o=fflags=+nobuffer # معطل: يلغي الكاش كلياً ويجعل البث غير مستقر
#demuxer-max-bytes=0             # معطل: يمنع تخصيص مساحة بالكاش
#demuxer-readahead-secs=0        # معطل: يمنع التحميل المسبق للبث
#deinterlace=auto                # معطل: استُبدل بـ no لتخفيف الضغط
#profile=gpu-hq                  # معطل: مخصص لكروت شاشة الكمبيوتر القوية فقط
#profile=fast                    # معطل: تم استخدام إعدادات مخصصة بدلاً منه
#scale=spline36                  # معطل: ثقيل جداً على كارت الشاشة ويسبب تقطيع 1080p
#cscale=spline36                 # معطل: ثقيل جداً على معالج البوكس
#correct-downscaling=yes         # معطل: خيارات تحسين معالجة ثقيلة على GPU
#linear-downscaling=yes          # معطل: تستهلك قوة المعالج
#linear-upscaling=yes            # معطل: تستهلك قوة المعالج
#sigmoid-upscaling=yes           # معطل: تستهلك قوة المعالج
#sigmoid-center=0.75             # معطل: غير مفيد مع معالجة bilinear
#sigmoid-slope=6.5               # معطل: غير مفيد مع معالجة bilinear
#contrast=2                      # معطل: يشوه الألوان الطبيعية للبث
#saturation=5                    # معطل: يجعل الألوان فاقعة ومزعجة
#gamma=0                         # معطل: يغير السطوع الاصطناعي للصورة
#hdr-compute-peak=yes            # معطل: غير مخصص لقنوات IPTV العادية (SDR)
#target-peak=auto                # معطل: مخصص لشاشات HDR فقط
#tone-map                       # معطل: يستهلك المعالج بدون فائدة لقنوات التلفزيون