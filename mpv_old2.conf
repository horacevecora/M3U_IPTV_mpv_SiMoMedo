#cache=no
cache=yes
#cache-secs=120
vo=gpu
#hwdec=auto
hwdec=mediacodec
#hwdec=mediacodec-copy
#hwdec=no
gpu-context=android
hdr-compute-peak=yes
stream-lavf-o=reconnect=1,reconnect_at_eof=1,reconnect_streamed=1,reconnect_delay_max=2
#network-timeout=10
demuxer-lavf-o=fflags=+nobuffer
demuxer-max-back-bytes
demuxer-max-bytes
