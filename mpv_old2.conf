demuxer-readahead-secs=0
contrast=2
correct-downscaling=yes
cscale=spline36
deband-grain=0
deband-iterations=1
deband-range=16
deband-threshold=35
deband=yes
#deinterlace=auto
dither-depth=auto
dither=fruit
dscale=mitchell
force-seekable=yes
framedrop=vo
gamma=0
linear-downscaling=yes
linear-upscaling=yes
saturation=5
scale=spline36
seekable=yes
sigmoid-center=0.75
sigmoid-slope=6.5
sigmoid-upscaling=yes
target-peak=auto
#tone-map
video-sync=audio